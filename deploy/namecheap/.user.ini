; =============================================================================
; WBIMIS USTP Balubal — Namecheap Stellar PHP limits
; -----------------------------------------------------------------------------
; Copy this file to the project's web-accessible document root on the server
; and name it exactly `.user.ini`. PHP-FPM/LiteSpeed picks it up automatically.
; =============================================================================

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
upload_max_filesize = 16M
post_max_size = 16M
display_errors = Off
log_errors = On
